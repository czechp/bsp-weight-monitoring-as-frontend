<app-page>
  <app-date-filter-form [filterForm]="filterForm" (applyFilter)="applyFilter()" />
 <div class="fts-form">
   <form [formGroup]="ftsForm" >
     <div>
       <label>Filtrowanie</label>
       <input placeholder="Wpisz nazwę linii lub produktu" type="text" formControlName="phrase" />
     </div>
     <button class="button-ok">Filtruj</button>
   </form>
 </div>
  <app-report-list *ngIf="reports$ | async as reports" [reports]="reports" (reportClick)="navigateToDetails($event)"/>
</app-page>
